<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Character</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app" class="hidden">
    <section class="panel">
      <header>
        <div class="eyebrow">CITIZEN SERVICES</div>
        <h1 id="heading">Select character</h1>
        <p id="subheading">Choose who you're bringing into the city.</p>
      </header>
      <div id="notice" role="status"></div>
      <div id="character-list" class="character-list"></div>
      <button id="new-character" class="secondary" type="button">＋ Create character</button>
      <form id="create-form" class="hidden">
        <div class="form-grid">
          <label>First name<input name="firstname" maxlength="24" minlength="2" required autocomplete="off"></label>
          <label>Last name<input name="lastname" maxlength="24" minlength="2" required autocomplete="off"></label>
          <label>Date of birth<input name="date_of_birth" type="date" required></label>
          <label>Gender<select name="gender" required><option value="">Choose</option><option value="male">Male</option><option value="female">Female</option><option value="other">Other</option></select></label>
        </div>
        <div class="actions">
          <button id="cancel-create" class="secondary" type="button">Back</button>
          <button class="primary" type="submit">Create character</button>
        </div>
      </form>
      <section id="appearance-editor" class="hidden">
        <div class="editor-heading">Clothing & accessories</div>
        <p class="editor-help">Preview component and accessory variations. Changes are saved to this character.</p>
        <div class="editor-extra">
        <section class="editor-group">
          <h2>Facial structure</h2>
          <div id="face-controls" class="face-grid"></div>
        </section>
        <section class="editor-group">
          <h2>Heritage blend</h2>
          <div class="heritage-grid">
            <label>Father ID<input id="shape-first" type="number" min="0" max="45" value="0"></label>
            <label>Mother ID<input id="shape-second" type="number" min="0" max="45" value="0"></label>
            <label>Skin father<input id="skin-first" type="number" min="0" max="45" value="0"></label>
            <label>Skin mother<input id="skin-second" type="number" min="0" max="45" value="0"></label>
            <label>Face blend<input id="shape-mix" type="number" min="0" max="1" step="0.05" value="0.5"></label>
            <label>Skin blend<input id="skin-mix" type="number" min="0" max="1" step="0.05" value="0.5"></label>
          </div>
          <button id="apply-heritage" type="button">Apply heritage</button>
        </section>
        <section class="editor-group">
          <h2>Hair & eyes</h2>
          <div class="heritage-grid">
            <label>Hair color<input id="hair-color" type="number" min="0" max="63" value="0"></label>
            <label>Hair highlight<input id="hair-highlight" type="number" min="0" max="63" value="0"></label>
            <label>Eye color<input id="eye-color" type="number" min="0" max="31" value="0"></label>
          </div>
          <div class="actions compact-actions">
            <button id="apply-hair" class="secondary" type="button">Apply hair</button>
            <button id="apply-eyes" class="secondary" type="button">Apply eyes</button>
          </div>
        </section>
      </div>
      <div class="editor-columns">
          <div><h2>Clothing</h2><div id="component-controls" class="editor-list"></div></div>
          <div><h2>Accessories</h2><div id="prop-controls" class="editor-list"></div></div>
        </div>
        <div class="actions">
          <button id="close-appearance" class="secondary" type="button">Close</button>
          <button id="save-appearance" class="primary" type="button">Save appearance</button>
        </div>
      </section>
    </section>
    <div class="corner">ROLEPLAY • CHARACTER ACCESS</div>
  </main>
  <script src="app.js"></script>
</body>
</html>
