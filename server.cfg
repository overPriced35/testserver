# Core FXServer configuration
# Set your license key and database connection locally; do not commit secrets.

endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

sv_maxclients 48
sv_enforceGameBuild 0
sv_scriptHookAllowed 0
sv_endpointPrivacy true
onesync on

# Replace locally. Keep credentials out of Git.
sv_licenseKey "CHANGE_ME"
set mysql_connection_string "mysql://USER:PASSWORD@127.0.0.1/DATABASE?charset=utf8mb4"

# Required dependency and the actual server foundation.
ensure oxmysql
ensure foundation

# Server identity is intentionally unset until the project identity is chosen.
# sets sv_projectName ""
# sets sv_projectDesc ""
